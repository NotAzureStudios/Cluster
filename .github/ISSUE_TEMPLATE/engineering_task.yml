name: Engineering task
description: Track a non-security change or technical-debt item
title: "task: "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and motivation
      description: Explain the outcome and why this is needed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include measurable behavior, tests, and edge cases.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Include security, data, migration, release, or runtime implications.
    validations:
      required: false
