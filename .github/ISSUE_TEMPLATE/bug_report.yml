name: Bug report
description: Report a reproducible Cluster defect (non-security)
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: "For security issues, follow SECURITY.md and do not file a normal issue."
  - type: input
    id: version
    attributes:
      label: Cluster build or commit
      description: Include exact release candidate, branch, or SHA.
      placeholder: "1.0.0-rc.50 / development @ <sha>"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Server / API
        - Web / Renderer
        - Desktop / Qt
        - Windows installer / update
        - Library / Transfers
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Click...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs and evidence
      description: Never upload access tokens, personal data, private URLs or credentials.
    validations:
      required: false
