name: Publish Cluster 1.0.2 Windows hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-cluster-1-0-2.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-cluster-1-0-2
  cancel-in-progress: false

jobs:
  publish:
    name: Publish only verified, real-installed Windows 1.0.2 binaries
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact release source and Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify no production source changed after Windows install smoke
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "NotAzureStudios/Cluster" && "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          git merge-base --is-ancestor 92f2b9f1ce219176b4433ecebfdfe602a8463786 "$GITHUB_SHA"
          while IFS= read -r changed; do
            [[ -z "$changed" ]] && continue
            case "$changed" in
              README.md|docs/*|.github/workflows/publish-cluster-1-0-2.yml) ;;
              *) echo "BLOCKED: runtime/build source changed since 1.0.2 installation smoke: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only 92f2b9f1ce219176b4433ecebfdfe602a8463786 "$GITHUB_SHA")
          node -e 'const p=require("./package.json"),r=require("./config/release-candidate.json");if(p.version!=="1.0.2"||r.release!=="1.0.2"||r.channel!=="stable")process.exit(1)'
      - name: Verify new Windows Server installer and source-bound receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.2 already exists; refuse to modify immutable release.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/server" "$RUNNER_TEMP/assets"
          gh run download 41575694455 --repo "$GITHUB_REPOSITORY" \
            --name cluster-server-1.0.2-unsigned-windows-x64-92f2b9f1ce219176b4433ecebfdfe602a8463786 \
            --dir "$RUNNER_TEMP/server"
          installer="$(find "$RUNNER_TEMP/server" -type f -name 'Cluster-Installer.exe' -print -quit)"
          manager="$(find "$RUNNER_TEMP/server" -type f -name 'Cluster Server.exe' -print -quit)"
          receipt="$(find "$RUNNER_TEMP/server" -type f -name 'build-receipt.json' -print -quit)"
          [[ -s "$installer" && -s "$manager" && -s "$receipt" ]] || { echo 'Incomplete 1.0.2 artifact'; exit 1; }
          echo "3a2f806a6bc393a0d12ddbc45615497edb29c65cfcd981dc5bbe5a3ad7e746ad  $installer" | sha256sum -c -
          echo "e14d7bd8797043349966f56473ca3e9fd15a75ca250470ee111833ed62d460b7  $manager" | sha256sum -c -
          jq -e '
            .product=="cluster-server" and .profile=="server-windows-x64" and
            .release=="1.0.2" and .sourceVersion=="1.0.2" and .channel=="main" and
            .commit=="92f2b9f1ce219176b4433ecebfdfe602a8463786" and
            .built==true and .signed==false and .certified==false and
            any(.artifacts[]; .path=="bin/Cluster-Installer.exe" and .sha256=="3a2f806a6bc393a0d12ddbc45615497edb29c65cfcd981dc5bbe5a3ad7e746ad") and
            any(.artifacts[]; .path=="bin/Cluster Server.exe" and .sha256=="e14d7bd8797043349966f56473ca3e9fd15a75ca250470ee111833ed62d460b7")
          ' "$receipt"
          cp "$installer" "$RUNNER_TEMP/assets/Cluster-Installer.exe"
          cp "$manager" "$RUNNER_TEMP/assets/Cluster-Server.exe"
          cp "$receipt" "$RUNNER_TEMP/assets/Cluster-server-build-receipt.json"
      - name: Preserve unchanged Qt Desktop and include evergreen download aliases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop"
          gh release download v1.0.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cluster-Desktop-Installer-0.482.0-windows-x64.exe' \
            --pattern 'Cluster-Desktop-0.482.0-windows-x64.zip' \
            --pattern 'Cluster-desktop-build-receipt.json' \
            --dir "$RUNNER_TEMP/desktop"
          echo '0e983320e440ff0b25cd56b8e14b6fcc76d565188e59245ca90923ec58537a05  Cluster-Desktop-Installer-0.482.0-windows-x64.exe' | (cd "$RUNNER_TEMP/desktop" && sha256sum -c -)
          echo '30b0d3cd64ea2c787a4eb87bfb5ba5bb50b19dd566e89a70746dee8f15242862  Cluster-Desktop-0.482.0-windows-x64.zip' | (cd "$RUNNER_TEMP/desktop" && sha256sum -c -)
          test -s "$RUNNER_TEMP/desktop/Cluster-desktop-build-receipt.json"
          cp "$RUNNER_TEMP/desktop/"* "$RUNNER_TEMP/assets/"
          cp "$RUNNER_TEMP/desktop/Cluster-Desktop-Installer-0.482.0-windows-x64.exe" "$RUNNER_TEMP/assets/Cluster-Desktop-Installer.exe"
          cp "$RUNNER_TEMP/desktop/Cluster-Desktop-0.482.0-windows-x64.zip" "$RUNNER_TEMP/assets/Cluster-Desktop-Portable.zip"
          test "$(find "$RUNNER_TEMP/assets" -maxdepth 1 -type f | wc -l)" -eq 8
          ls -lh "$RUNNER_TEMP/assets"
      - name: Publish Cluster v1.0.2 with all eight verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.2 "$RUNNER_TEMP/assets/"* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Cluster 1.0.2 | Azure Studios' \
            --notes-file docs/releases/CLUSTER_1_0_2.md --latest
          gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets,url
# One-shot publisher; remove after successful release. Original binary hashes
# and real first-install Windows smoke remain part of immutable release evidence.
