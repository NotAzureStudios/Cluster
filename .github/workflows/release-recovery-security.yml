name: Release, recovery and session security

on:
  push:
    branches: [development, main, fix/rc-release-recovery-auth-closeout]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  release-recovery-security:
    name: Distribution, backup and auth checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Release profile plans and product isolation
        run: node tools/scripts/cluster-platform-release-tests.mjs
      - name: Auth and destructive restore guards
        run: node --disable-warning=ExperimentalWarning tools/scripts/cluster-rc-release-recovery-auth-tests.mjs
      - name: Role-based password minimum and authentication policy
        run: node --disable-warning=ExperimentalWarning tools/scripts/cluster-password-role-policy-tests.mjs
      - name: Server update signature, download and staging tests
        working-directory: apps/server-launcher-go
        run: go test ./...
      - name: Server installer signer syntax
        run: node --check tools/scripts/cluster-sign-server-release.mjs
