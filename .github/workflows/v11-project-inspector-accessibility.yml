name: Cluster 1.1 Project Inspector Accessibility
on:
  pull_request:
    branches: [development]
    paths:
      - "packages/renderer/src/features/projects/ProjectsPage.tsx"
      - "packages/renderer/src/features/projects/ProjectPortfolioItem.tsx"
      - "packages/renderer/src/features/projects/project-inspector-focus.ts"
      - "packages/renderer/src/features/projects/projects.css"
      - "tools/scripts/cluster-v11-project-inspector-accessibility-tests.mjs"
      - ".github/workflows/v11-project-inspector-accessibility.yml"
  push:
    branches: [feat/v11-project-inspector-accessibility]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-inspector:
    name: Project inspector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
      - run: npm ci --no-audit --no-fund
      - name: Project inspector interaction and focus contracts
        run: node tools/scripts/cluster-v11-project-inspector-accessibility-tests.mjs
      - name: Build shared contracts
        run: npm run build --workspace=@cluster/shared
      - name: Compile and type-check renderer
        run: npm run build --workspace=@cluster/renderer
