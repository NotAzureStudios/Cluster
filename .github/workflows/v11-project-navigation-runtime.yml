name: Cluster 1.1 Project Navigation Runtime
on:
  pull_request:
    branches: [development]
    paths:
      - "packages/renderer/src/features/projects/project-tab-location.ts"
      - "packages/renderer/src/features/projects/project-primary-tabs.ts"
      - "packages/renderer/src/features/projects/ProjectWorkspaceNav.tsx"
      - "packages/renderer/src/features/projects/ProjectDetailHeader.tsx"
      - "packages/renderer/src/features/projects/useProjectDetailWorkspace.ts"
      - "packages/renderer/src/features/projects/project-detail-workspace.css"
      - "packages/renderer/src/components/CompactSectionNav.tsx"
      - "tools/scripts/cluster-v11-project-navigation-runtime-tests.mjs"
      - ".github/workflows/v11-project-navigation-runtime.yml"
  push:
    branches: [feat/v11-project-navigation-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-navigation:
    name: Project navigation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
      - run: npm ci --no-audit --no-fund
      - name: Exercise project navigation and network budgets
        run: node tools/scripts/cluster-v11-project-navigation-runtime-tests.mjs
      - name: Build shared contracts
        run: npm run build --workspace=@cluster/shared
      - name: Compile and type-check renderer
        run: npm run build --workspace=@cluster/renderer
