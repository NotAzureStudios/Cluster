name: v1.1 Guided account provisioning

on:
  pull_request:
    branches: [main, 'feat/people-accounts-context-navigation-v11']
    paths:
      - 'apps/server/src/domains/users/people-provisioning-preview-routes.ts'
      - 'apps/server/src/domains/users/people-role-change-preview-routes.ts'
      - 'apps/server/src/domains/users/user-directory-routes.ts'
      - 'packages/renderer/src/features/people/PeopleAccountProvisioningWizard.tsx'
      - 'packages/renderer/src/features/people/PeopleRoleAssignmentPanel.tsx'
      - 'packages/renderer/src/features/people/PeoplePages.tsx'
      - 'packages/renderer/src/features/people/people-account-provisioning-wizard.css'
      - 'packages/renderer/src/features/people/people-role-impact-preview.css'
      - 'tools/scripts/cluster-v11-guided-provisioning-*.mjs'
      - '.github/workflows/v11-guided-provisioning.yml'
  push:
    branches: [main]
    paths:
      - 'apps/server/src/domains/users/people-provisioning-preview-routes.ts'
      - 'apps/server/src/domains/users/people-role-change-preview-routes.ts'
      - 'packages/renderer/src/features/people/PeopleAccountProvisioningWizard.tsx'
      - 'tools/scripts/cluster-v11-guided-provisioning-*.mjs'

permissions:
  contents: read

jobs:
  provisioning-review-and-build:
    name: Account preflight and Server/Web build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use pinned Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Verify guided creation and permission-review contracts
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types tools/scripts/cluster-v11-guided-provisioning-contract-tests.mjs
      - name: Verify existing People account and lifecycle contracts
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types tools/scripts/cluster-v11-people-account-management-tests.mjs
      - name: Restore pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DIRECT_DATABASE_URL: postgresql://cluster_build:unused@127.0.0.1:1/cluster_build
          DATABASE_URL: postgresql://cluster_build:unused@127.0.0.1:1/cluster_build
      - name: Compile complete Server and Web
        run: npm run build
        env:
          DIRECT_DATABASE_URL: postgresql://cluster_build:unused@127.0.0.1:1/cluster_build
          DATABASE_URL: postgresql://cluster_build:unused@127.0.0.1:1/cluster_build
      - name: Exercise compiled Fastify authorization and provisioning preview
        run: node tools/scripts/cluster-v11-guided-provisioning-route-smoke.mjs
      - name: Verify compiled role-change preview, owner protection and access deltas
        run: node tools/scripts/cluster-v11-role-change-preview-route-smoke.mjs
      - name: Preserve existing account directory security tests
        run: node tools/scripts/cluster-v11-people-account-management-route-smoke.mjs
