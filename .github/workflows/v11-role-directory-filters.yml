name: Cluster 1.1 Roles Directory Filters
on:
  pull_request:
    branches: [development]
    paths:
      - "packages/renderer/src/features/settings/StudioSettingsPage.tsx"
      - "packages/renderer/src/features/settings/role-directory-filter.ts"
      - "packages/renderer/src/features/settings/people-management-layout-v11.css"
      - "tools/scripts/cluster-v11-role-filters-tests.mjs"
      - ".github/workflows/v11-role-directory-filters.yml"
  push:
    branches: [feat/v11-role-directory-filters-selectors]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-directory:
    name: Role management UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
      - run: npm ci --no-audit --no-fund
      - name: Validate role filters and assignment safeguards
        run: node tools/scripts/cluster-v11-role-filters-tests.mjs
      - name: Build shared contracts
        run: npm run build --workspace=@cluster/shared
      - name: Build and typecheck renderer
        run: npm run build --workspace=@cluster/renderer
