name: Cluster 1.1 Online Cache Read Budget
on:
  pull_request:
    branches: [development]
    paths:
      - "packages/renderer/src/core/api/query.ts"
      - "tools/scripts/cluster-v11-online-cache-read-budget-tests.mjs"
      - ".github/workflows/v11-online-cache-read-budget.yml"
  push:
    branches: [perf/v11-online-cache-read-budget]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-read:
    name: Online cache read (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
      - run: npm ci --no-audit --no-fund
      - name: Cold cache, storage block, offline and session correctness
        run: node tools/scripts/cluster-v11-online-cache-read-budget-tests.mjs
      - name: Existing network-cache and invalidation race regressions
        run: node tools/scripts/cluster-rc32-navigation-cache-performance-tests.mjs && node tools/scripts/cluster-rc36-cache-race-tests.mjs && node tools/scripts/cluster-rc31-cache-inventory-regressions.mjs
        shell: bash
      - name: Build shared
        run: npm run build --workspace=@cluster/shared
      - name: Compile and type-check renderer
        run: npm run build --workspace=@cluster/renderer
