name: v1.1 Manager Assignment

on:
  pull_request:
    branches: [development]
    paths:
      - 'apps/server/src/domains/users/people-governance.ts'
      - 'apps/server/src/domains/users/user-directory-routes.ts'
      - 'packages/renderer/src/features/people/PeoplePages.tsx'
      - 'packages/renderer/src/features/people/PeopleUserEditor.tsx'
      - 'tools/scripts/cluster-v11-manager-assignment-tests.mjs'
      - '.github/workflows/v11-manager-assignment.yml'
  push:
    branches: [development, feat/v1.1-manager-assignment]
    paths:
      - 'apps/server/src/domains/users/people-governance.ts'
      - 'apps/server/src/domains/users/user-directory-routes.ts'
      - 'packages/renderer/src/features/people/PeoplePages.tsx'
      - 'packages/renderer/src/features/people/PeopleUserEditor.tsx'
      - 'tools/scripts/cluster-v11-manager-assignment-tests.mjs'
      - '.github/workflows/v11-manager-assignment.yml'

permissions:
  contents: read

jobs:
  manager-assignment-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types tools/scripts/cluster-v11-manager-assignment-tests.mjs
