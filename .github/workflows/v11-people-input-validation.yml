name: v1.1 People Input Validation

on:
  pull_request:
    branches: [development]
    paths:
      - 'apps/server/src/domains/users/people-input-validation.ts'
      - 'apps/server/src/domains/users/user-directory-routes.ts'
      - 'apps/server/src/domains/studio-systems/studio-return-eligibility.ts'
      - 'tools/scripts/cluster-v11-people-input-validation-tests.mjs'
      - '.github/workflows/v11-people-input-validation.yml'
  push:
    branches: [development, fix/v11-people-input-validation]
    paths:
      - 'apps/server/src/domains/users/people-input-validation.ts'
      - 'apps/server/src/domains/users/user-directory-routes.ts'
      - 'apps/server/src/domains/studio-systems/studio-return-eligibility.ts'
      - 'tools/scripts/cluster-v11-people-input-validation-tests.mjs'
      - '.github/workflows/v11-people-input-validation.yml'

permissions:
  contents: read

jobs:
  validation-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types tools/scripts/cluster-v11-people-input-validation-tests.mjs
