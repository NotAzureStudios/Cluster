      - "apps/server/src/app/server-routes-configuration-integrations.ts"
      - "apps/server/src/app/server-composition-types.ts"
      - "apps/server/src/app/server-services-request-domain.ts"
      - "packages/renderer/src/features/application/application-models/custom-admin-automation.ts"
      - "packages/renderer/src/features/application/application-models/settings-server.ts"
