      - "tools/scripts/cluster-performance-settings-tests.mjs"
      - "tools/scripts/cluster-ui-idle-portfolio-tests.mjs"
      - "tools/scripts/cluster-server-resource-performance-tests.mjs"
      - "apps/server/src/core/server-resource-policy.ts"
      - "apps/server/src/core/resource-governor.ts"
