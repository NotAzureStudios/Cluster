name: Build Cluster 1.0.1 Windows Server installer

on:
  push:
    branches: [main]
    paths:
      - 'config/release-candidate.json'
      - 'config/toolchain-versions.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/installer/**'
      - 'tools/scripts/cluster-rc-preflight.mjs'
      - 'tools/scripts/cluster-prebuilt-install-gate-tests.mjs'
      - '.github/workflows/cluster-1-0-1-server-build.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Windows build runner (dedicated self-hosted requires cluster-build label)'
        required: true
        type: choice
        default: 'github-hosted'
        options:
          - 'github-hosted'
          - 'self-hosted'

permissions:
  contents: read

concurrency:
  group: cluster-1-0-1-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-1-0-1:
    name: Compile and verify native Server 1.0.1
    # GitHub-hosted runners may be blocked by private-repository billing/limits.
    # The manual self-hosted route requires a trusted, isolated Windows x64
    # machine with a custom cluster-build label, not the live Cluster Server.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","Windows","X64","cluster-build"]') || 'windows-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout reviewed main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Node.js 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Install pinned Go 1.27.1
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify authentic 1.0.1 source and installer admission fix
        shell: pwsh
        run: |
          if ((git branch --show-current).Trim() -ne 'main') { throw 'The 1.0.1 Server build must come from main' }
          node --check tools/scripts/cluster-1-0-1-version-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source version contract contains invalid JavaScript' }
          node --check tools/scripts/build-cluster-installer.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Prebuilt packager contains invalid JavaScript' }
          node tools/scripts/cluster-1-0-1-version-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source versions do not agree' }
          node tools/scripts/cluster-release-lockfile-check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Root npm lockfile does not match 1.0.1' }
          node tools/scripts/cluster-prebuilt-install-gate-tests.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installer first-install regression test failed' }
          node tools/scripts/cluster-platform-release-tests.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release profile contract regression failed' }
      - name: Build complete precompiled Windows Server installer
        shell: pwsh
        env:
          CLUSTER_INSTALLER_PAYLOAD: prebuilt
          GOTOOLCHAIN: local
        run: |
          node tools/scripts/cluster-platform-release.mjs --profile server-windows-x64 --channel main --build
          if ($LASTEXITCODE -ne 0) {
            git diff --name-status
            throw 'Cluster 1.0.1 release compilation/packaging failed'
          }
      - name: Verify release commit, binaries and SHA-256 receipt
        shell: pwsh
        run: |
          $receipt = Get-Content -Raw 'artifacts/release-profiles/server-windows-x64/build-receipt.json' | ConvertFrom-Json
          if ($receipt.product -ne 'cluster-server' -or $receipt.profile -ne 'server-windows-x64' -or $receipt.channel -ne 'main' -or $receipt.release -ne '1.0.1' -or $receipt.sourceVersion -ne '1.0.1' -or !$receipt.built -or $receipt.signed -or $receipt.certified) { throw 'Incorrect 1.0.1 receipt' }
          if ($receipt.commit -ne (git rev-parse HEAD).Trim()) { throw 'Receipt commit mismatch' }
          if ($receipt.lockfileSha256 -ne (Get-FileHash package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Dependency lockfile hash mismatch' }
          foreach ($name in @('bin/Cluster-Installer.exe','bin/Cluster Server.exe')) {
            $artifact = $receipt.artifacts | Where-Object { $_.path -eq $name }
            if (@($artifact).Count -ne 1) { throw "Missing receipt: $name" }
            if (!(Test-Path -LiteralPath $name)) { throw "Missing binary: $name" }
            if ((Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant() -ne $artifact.sha256) { throw "SHA-256 mismatch: $name" }
            $bin = [IO.File]::ReadAllBytes((Resolve-Path $name))
            if ($bin.Length -lt 512 -or $bin[0] -ne 77 -or $bin[1] -ne 90) { throw "Not Windows PE: $name" }
          }
          $receipt | ConvertTo-Json -Depth 12 | Write-Output
      - name: Retain unsigned Server 1.0.1 test binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cluster-server-1.0.1-unsigned-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            bin/Cluster-Installer.exe
            bin/Cluster Server.exe
            artifacts/release-profiles/server-windows-x64/build-receipt.json

# Produces unsigned first-install test artifacts. Does NOT publish a v1.0.1 tag
# or overwrite a previously published binary. A Windows install/launch test
# is still required before calling the installer verified.
