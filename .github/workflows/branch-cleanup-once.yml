name: One-time cleanup of squash-merged Cluster work branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove only unchanged, reviewed historical branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main with short-lived repository credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Delete four known squash-merged branch tips using remote SHA leases
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "NotAzureStudios/Cluster" ]] || { echo 'Wrong repository'; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo 'Cleanup must run from main'; exit 1; }
          declare -A expected
          expected['docs/1-0-release-readme-cleanup']='a2d4c330937db0490c5f7d6eb8d57e6604615de3'
          expected['fix/1-0-1-prebuilt-installer-admission']='29267940fc2ae5788f5f91189f9730d583af1a7a'
          expected['release/1.0.0']='b66928bc8e7258696c7274d09463a004eb1dee92'
          expected['release/1.0.1-source']='de9dda307a07813a7fcd0c0a327fc5ef23ec3f5a'
          for name in \
            docs/1-0-release-readme-cleanup \
            fix/1-0-1-prebuilt-installer-admission \
            release/1.0.0 \
            release/1.0.1-source; do
            ref="refs/heads/$name"
            actual="$(git ls-remote --heads origin "$ref" | awk '{print $1}')"
            if [[ -z "$actual" ]]; then
              echo "Already deleted: $name"
              continue
            fi
            if [[ "$actual" != "${expected[$name]}" ]]; then
              echo "REFUSING to delete changed work: $name expected ${expected[$name]}, got $actual"
              exit 1
            fi
            echo "Removing unchanged squash-merged work branch: $name"
            git push "--force-with-lease=$ref:${expected[$name]}" origin ":$ref"
          done
          echo 'Preserved main, development, and archive/main-pre-development-consolidation-2026-11-02'
          for keep in main development archive/main-pre-development-consolidation-2026-11-02; do
            git ls-remote --exit-code --heads origin "refs/heads/$keep" >/dev/null || {
              echo "Protected ref missing: $keep"
              exit 1
            }
          done
          echo 'Branch cleanup completed and protected refs verified.'
# This is deliberately a single-use workflow. Remove this workflow after
# confirming success. Never use it to delete the unique-history archive.
