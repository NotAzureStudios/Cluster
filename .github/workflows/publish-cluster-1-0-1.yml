name: Publish Cluster 1.0.1 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-cluster-1-0-1.yml]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Verify binaries and publish v1.0.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify no code has changed since validated Windows build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "NotAzureStudios/Cluster" && "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          git merge-base --is-ancestor 747832c6cdf53a97c0923e045c04c08e8b17d5a0 "$GITHUB_SHA"
          while IFS= read -r changed; do
            [[ -z "$changed" ]] && continue
            case "$changed" in
              README.md|docs/*|.github/workflows/publish-cluster-1-0-1.yml) ;;
              *) echo "BLOCKED: runtime source changed since built binary: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only 747832c6cdf53a97c0923e045c04c08e8b17d5a0 "$GITHUB_SHA")
          node -e 'let p=require("./package.json"),r=require("./config/release-candidate.json");if(p.version!=="1.0.1"||r.release!=="1.0.1"||r.channel!=="stable")process.exit(1)'
      - name: Download and verify 1.0.1 Windows Server
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'v1.0.1 already exists'; exit 1; fi
          mkdir -p "$RUNNER_TEMP/server" "$RUNNER_TEMP/assets"
          gh run download 41565552099 --repo "$GITHUB_REPOSITORY" \
            --name cluster-server-1.0.1-unsigned-windows-x64-747832c6cdf53a97c0923e045c04c08e8b17d5a0 \
            --dir "$RUNNER_TEMP/server"
          installer="$(find "$RUNNER_TEMP/server" -type f -name 'Cluster-Installer.exe' -print -quit)"
          manager="$(find "$RUNNER_TEMP/server" -type f -name 'Cluster Server.exe' -print -quit)"
          receipt="$(find "$RUNNER_TEMP/server" -type f -name 'build-receipt.json' -print -quit)"
          [[ -s "$installer" && -s "$manager" && -s "$receipt" ]] || { echo 'Server package incomplete'; exit 1; }
          echo "2719e1b1336144773c0e5ad9b361fae2d73109c08b2495592f04a92ccc9968f7  $installer" | sha256sum -c -
          echo "ec0377398787e33c54b502a046992c6620aa16f4bd6af9bfbad720bb2f2c153d  $manager" | sha256sum -c -
          jq -e '
            .product=="cluster-server" and .profile=="server-windows-x64" and
            .release=="1.0.1" and .sourceVersion=="1.0.1" and .channel=="main" and
            .commit=="747832c6cdf53a97c0923e045c04c08e8b17d5a0" and
            .built==true and .signed==false and .certified==false and
            any(.artifacts[]; .path=="bin/Cluster-Installer.exe" and .sha256=="2719e1b1336144773c0e5ad9b361fae2d73109c08b2495592f04a92ccc9968f7") and
            any(.artifacts[]; .path=="bin/Cluster Server.exe" and .sha256=="ec0377398787e33c54b502a046992c6620aa16f4bd6af9bfbad720bb2f2c153d")
          ' "$receipt"
          cp "$installer" "$RUNNER_TEMP/assets/Cluster-Installer.exe"
          cp "$manager" "$RUNNER_TEMP/assets/Cluster-Server.exe"
          cp "$receipt" "$RUNNER_TEMP/assets/Cluster-server-build-receipt.json"
      - name: Include unchanged Qt Desktop distribution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop"
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cluster-Desktop-Installer-0.482.0-windows-x64.exe' \
            --pattern 'Cluster-Desktop-0.482.0-windows-x64.zip' \
            --pattern 'Cluster-desktop-build-receipt.json' \
            --dir "$RUNNER_TEMP/desktop"
          echo '0e983320e440ff0b25cd56b8e14b6fcc76d565188e59245ca90923ec58537a05  Cluster-Desktop-Installer-0.482.0-windows-x64.exe' | (cd "$RUNNER_TEMP/desktop" && sha256sum -c -)
          echo '30b0d3cd64ea2c787a4eb87bfb5ba5bb50b19dd566e89a70746dee8f15242862  Cluster-Desktop-0.482.0-windows-x64.zip' | (cd "$RUNNER_TEMP/desktop" && sha256sum -c -)
          test -s "$RUNNER_TEMP/desktop/Cluster-desktop-build-receipt.json"
          cp "$RUNNER_TEMP/desktop/"* "$RUNNER_TEMP/assets/"
      - name: Publish private studio v1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.1 "$RUNNER_TEMP/assets/"* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Cluster 1.0.1 | Azure Studios' \
            --notes-file docs/releases/CLUSTER_1_0_1.md --latest
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url
# Single-use publication workflow. Do not modify release assets after publication.
