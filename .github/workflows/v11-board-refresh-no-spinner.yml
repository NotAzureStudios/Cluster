name: Cluster 1.1 Board Refresh Presentation
on:
  pull_request:
    branches: [development]
    paths:
      - "packages/renderer/src/features/application/ClusterApplication.tsx"
      - "packages/renderer/src/features/application/board-loading-policy.ts"
      - "tools/scripts/cluster-v11-board-refresh-no-spinner-tests.mjs"
      - ".github/workflows/v11-board-refresh-no-spinner.yml"
  push:
    branches: [fix/v11-board-refresh-no-spinner]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  board-refresh:
    name: Board refresh presentation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
      - run: npm ci --no-audit --no-fund
      - name: Board refresh and navigation race checks
        run: node tools/scripts/cluster-v11-board-refresh-no-spinner-tests.mjs
      - name: Existing Board UI and navigation regression
        run: node tools/scripts/cluster-v11-board-bulk-selection-scope-tests.mjs && node tools/scripts/cluster-g27-p6-authorized-board-navigation-tests.mjs
        shell: bash
      - name: Build shared
        run: npm run build --workspace=@cluster/shared
      - name: Compile and type-check renderer
        run: npm run build --workspace=@cluster/renderer
