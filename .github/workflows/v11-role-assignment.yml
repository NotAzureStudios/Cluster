name: v1.1 People Role Assignment

on:
  pull_request:
    branches: [development]
    paths:
      - 'apps/server/src/domains/users/**'
      - 'packages/renderer/src/features/people/PeopleUserEditor.tsx'
      - 'packages/renderer/src/features/people/PeopleRoleAssignmentPanel.tsx'
      - 'packages/renderer/src/features/people/PeoplePages.tsx'
      - 'tools/scripts/cluster-v11-role-assignment-tests.mjs'
      - '.github/workflows/v11-role-assignment.yml'
  push:
    branches: [development, feat/v1.1-user-role-assignment]
    paths:
      - 'apps/server/src/domains/users/**'
      - 'packages/renderer/src/features/people/PeopleUserEditor.tsx'
      - 'packages/renderer/src/features/people/PeopleRoleAssignmentPanel.tsx'
      - 'packages/renderer/src/features/people/PeoplePages.tsx'
      - 'tools/scripts/cluster-v11-role-assignment-tests.mjs'
      - '.github/workflows/v11-role-assignment.yml'

permissions:
  contents: read

jobs:
  role-assignment-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types tools/scripts/cluster-v11-role-assignment-tests.mjs
