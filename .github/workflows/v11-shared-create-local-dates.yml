name: Cluster 1.1 Shared Create Civil Dates
on:
  pull_request:
    branches: [development]
    paths:
      - "packages/renderer/src/core/date-time.ts"
      - "packages/renderer/src/features/create/SharedCreateDrawer.tsx"
      - "tools/scripts/cluster-v11-shared-create-local-day-tests.mjs"
      - ".github/workflows/v11-shared-create-local-dates.yml"
  push:
    branches: [fix/v11-shared-create-local-day-defaults]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-create-dates:
    name: Shared Create local dates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
      - run: npm ci --no-audit --no-fund
      - name: Shared creation civil-date contract
        run: node tools/scripts/cluster-v11-shared-create-local-day-tests.mjs
      - name: Existing Calendar date navigation regression
        run: node tools/scripts/cluster-v11-calendar-date-navigation-tests.mjs
      - name: Shared contracts
        run: npm run build --workspace=@cluster/shared
      - name: Renderer compile and type-check
        run: npm run build --workspace=@cluster/renderer
