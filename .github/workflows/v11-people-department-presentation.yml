name: v1.1 People Department Presentation

on:
  pull_request:
    branches: [development]
    paths:
      - 'packages/renderer/src/components/PersonSummary.tsx'
      - 'packages/renderer/src/features/people/PeoplePages.tsx'
      - 'tools/scripts/cluster-v11-people-dept-presentation-tests.mjs'
      - '.github/workflows/v11-people-department-presentation.yml'
  push:
    branches: [development, feat/v1.1-department-presentation]
    paths:
      - 'packages/renderer/src/components/PersonSummary.tsx'
      - 'packages/renderer/src/features/people/PeoplePages.tsx'
      - 'tools/scripts/cluster-v11-people-dept-presentation-tests.mjs'
      - '.github/workflows/v11-people-department-presentation.yml'

permissions:
  contents: read

jobs:
  people-department-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: node tools/scripts/cluster-v11-people-dept-presentation-tests.mjs
