name: v1.1 Role Directory UI

on:
  pull_request:
    branches: [development]
    paths:
      - 'packages/renderer/src/features/settings/StudioSettingsPage.tsx'
      - 'packages/renderer/src/features/settings/people-management-layout-v11.css'
      - 'tools/scripts/cluster-v11-role-directory-tests.mjs'
      - '.github/workflows/v11-role-directory.yml'
  push:
    branches: [development, feat/v11-role-directory-usability]
    paths:
      - 'packages/renderer/src/features/settings/StudioSettingsPage.tsx'
      - 'packages/renderer/src/features/settings/people-management-layout-v11.css'
      - 'tools/scripts/cluster-v11-role-directory-tests.mjs'
      - '.github/workflows/v11-role-directory.yml'

permissions:
  contents: read

jobs:
  role-directory-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: node tools/scripts/cluster-v11-role-directory-tests.mjs
