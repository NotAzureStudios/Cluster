name: Windows Server panel poll budgets

on:
  push:
    branches: [development, main, fix/windows-server-panel-poll-budget]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  native-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Node.js pinned
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Go unit tests
        working-directory: apps/server-launcher-go
        run: go test ./...
      - name: Compile native Windows control panel
        working-directory: apps/server-launcher-go
        run: go build -o "${{ runner.temp }}/Cluster-Server-poll-test.exe" .
      - name: Assert native startup, runtime and log safety
        run: node tools/scripts/cluster-native-server-fundamentals-tests.mjs
      - name: Assert poll budgets
        run: node tools/scripts/cluster-windows-panel-poll-budget-tests.mjs
      - name: GPU progress bar uses cached sensor
        run: node tools/scripts/cluster-native-gpu-meter-tests.mjs
      - name: Native dashboard and installer first-run contracts
        run: node tools/scripts/cluster-native-server-install-experience-tests.mjs
      - name: Windows installer contract checks
        run: node tools/installer/installer-contract-tests.mjs
