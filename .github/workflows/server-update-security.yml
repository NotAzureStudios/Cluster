name: Signed Windows Server update verification

on:
  push:
    branches: ['server/**', development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  server-update:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Go pinned
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify server update signatures, channel boundaries and installed sequence
        run: go -C apps/server-launcher-go test ./...
      - name: Verify native broker cannot bypass stopped-process safety guard
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/installer/Server-Update-Process-Guard-Tests.ps1
      - name: Verify staged-install and maintenance-hold source contracts
        run: node tools/scripts/cluster-1-0-3-update-safety-contract-tests.mjs
      - name: Compile Windows Server launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go -C apps/server-launcher-go build -o "${{ runner.temp }}/ClusterServer.exe" .
      - name: Node.js pinned
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Check release signer syntax
        run: node --check tools/scripts/cluster-sign-server-release.mjs
      - name: Verify signed main feed, release publisher and native Check Updates flow
        run: node tools/scripts/cluster-server-update-delivery-contract-tests.mjs
      - name: Web update check and staging authority boundaries
        run: node tools/scripts/cluster-web-server-update-source-tests.mjs
      - name: Signed staging progress UI regression
        run: node tools/scripts/cluster-web-server-update-progress-tests.mjs
# This is a source/build contract; no installation, service upgrade or backup
# restoration is considered certified by a successful result here.
