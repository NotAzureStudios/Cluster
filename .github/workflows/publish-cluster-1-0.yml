name: Publish Cluster 1.0 studio release

on:
  push:
    branches: [main]
    paths:
      - docs/releases/CLUSTER_1_0_0.md

permissions:
  contents: write
  actions: read

jobs:
  publish-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact declared 1.0 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify published binary build evidence and package receipts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "Not the authoritative release branch"; exit 1; }
          if gh release view v1.0.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Cluster v1.0.0 already published; no mutation performed."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/server" "$RUNNER_TEMP/desktop" "$RUNNER_TEMP/assets"
          gh run download 41545605940 --repo "$GITHUB_REPOSITORY" \
            --name cluster-server-rc50-prebuilt-windows-x64-6afcedad7f4452e28e57d34f7ea8af50b7db992d \
            --dir "$RUNNER_TEMP/server"
          gh run download 41547147724 --repo "$GITHUB_REPOSITORY" \
            --name cluster-desktop-qt-0-482-0-beta-windows-x64-428f3182e18b0733726f049aa48234bb4688529d \
            --dir "$RUNNER_TEMP/desktop"
          find_file() {
            local base="$1" filename="$2"
            find "$base" -type f -name "$filename" -print -quit
          }
          verify_copy() {
            local base="$1" name="$2" expected="$3"
            local source
            source="$(find_file "$base" "$name")"
            [[ -n "$source" && -f "$source" ]] || { echo "Missing artifact: $name"; exit 1; }
            echo "$expected  $source" | sha256sum -c -
            cp "$source" "$RUNNER_TEMP/assets/$name"
          }
          verify_copy "$RUNNER_TEMP/server" 'Cluster-Installer.exe' 7c2766dc56e2f9369ef6f16742ae9500c8447eedd1aa0196a38a42afc4b88807
          verify_copy "$RUNNER_TEMP/server" 'Cluster Server.exe' b8dc630f6c230c9c0d4e7bacf79d9855f8512fc80cd586cdd4c7246ffab33a33
          verify_copy "$RUNNER_TEMP/desktop" 'Cluster-Desktop-Installer-0.482.0-windows-x64.exe' 0e983320e440ff0b25cd56b8e14b6fcc76d565188e59245ca90923ec58537a05
          verify_copy "$RUNNER_TEMP/desktop" 'Cluster-Desktop-0.482.0-windows-x64.zip' 30b0d3cd64ea2c787a4eb87bfb5ba5bb50b19dd566e89a70746dee8f15242862
          for product in server desktop; do
            receipt="$(find_file "$RUNNER_TEMP/$product" build-receipt.json)"
            [[ -n "$receipt" && -s "$receipt" ]] || { echo "Missing $product receipt"; exit 1; }
            cp "$receipt" "$RUNNER_TEMP/assets/Cluster-$product-build-receipt.json"
          done
          echo "Validated four independent 1.0 distribution assets and both original build receipts."
      - name: Create the requested Cluster v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Cluster v1.0.0 already published."
            exit 0
          fi
          gh release create v1.0.0 "$RUNNER_TEMP/assets/"* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Cluster 1.0.0 | Azure Studios" \
            --notes-file docs/releases/CLUSTER_1_0_0.md \
            --latest
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets,url
# The version declaration is an owner-approved private-studio release.
# The release notes explicitly disclose differing component build commits,
# unsigned Windows assets, and unverified live installation/update behavior.
