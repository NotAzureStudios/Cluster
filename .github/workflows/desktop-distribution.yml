name: Desktop distribution and update isolation

on:
  push:
    branches: ['client/**', development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  desktop-update-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Go pinned
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify signed Desktop updater product boundary
        run: go -C apps/update-helper-go test ./...
      - name: Node.js pinned
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Check Qt CPack installer build script
        run: node --check tools/scripts/package-qt-desktop.mjs
      - name: Verify independent Qt portable/NSIS contents contract
        run: node tools/scripts/cluster-desktop-packaging-contract-tests.mjs
# Actual Qt 6.11.2 Windows builds, NSIS setup and installer launch/rollback
# remain separate release gates and are NOT certified by this source test.
