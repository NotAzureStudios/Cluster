name: Cluster 1.1 Board Bulk Selection Scope
on:
  pull_request:
    branches: [development]
    paths:
      - "packages/renderer/src/features/boards/BoardWorkspacePage.tsx"
      - "packages/renderer/src/features/boards/board-selection-projection.ts"
      - "packages/renderer/src/features/boards/board-workspace.css"
      - "tools/scripts/cluster-v11-board-bulk-selection-scope-tests.mjs"
      - ".github/workflows/v11-board-bulk-selection-scope.yml"
  push:
    branches: [fix/v11-board-bulk-selection-scope]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  board-selection:
    name: Board selection (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
      - run: npm ci --no-audit --no-fund
      - name: Board selection contracts and large-card set behavior
        run: node tools/scripts/cluster-v11-board-bulk-selection-scope-tests.mjs
      - name: Existing Board Card and view regressions
        run: node tools/scripts/cluster-v11-board-actionable-blockers-tests.mjs && node tools/scripts/cluster-v11-board-list-table-windowing-tests.mjs && node tools/scripts/cluster-v11-board-completed-deadlines-tests.mjs
        shell: bash
      - name: Shared contracts
        run: npm run build --workspace=@cluster/shared
      - name: Compile and type-check renderer
        run: npm run build --workspace=@cluster/renderer
