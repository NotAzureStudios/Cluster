name: Cluster Windows offline upgrade smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/installer/**'
      - 'apps/server-launcher-go/**'
      - 'apps/server/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'config/release-candidate.json'
      - 'config/toolchain-versions.json'
      - 'config/distribution-profiles.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cluster-server-offline-upgrade-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-server-offline-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Preserve data during an offline Windows 1.0.5 to next-release upgrade
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Set up pinned Go 1.27.1
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify source and lockfile
        shell: pwsh
        run: |
          node tools/scripts/cluster-suite-version-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Candidate version contract failed' }
          node tools/scripts/cluster-release-lockfile-check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Lockfile verification failed' }
      - name: Build unsigned candidate without bypassing main release branch protection
        shell: pwsh
        env:
          CLUSTER_INSTALLER_PAYLOAD: prebuilt
          GOTOOLCHAIN: local
          DATABASE_URL: postgresql://cluster_build:unused@127.0.0.1:1/cluster_build
          DIRECT_DATABASE_URL: postgresql://cluster_build:unused@127.0.0.1:1/cluster_build
        run: |
          # This is a PR test, not release packaging. The release packager
          # deliberately refuses detached/PR refs, and that guard stays intact.
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          foreach ($script in @(
            'cluster-rc-native-checks.mjs',
            'build-native-host.mjs',
            'build-server-launcher.mjs',
            'build-cluster-server-entry.mjs',
            'build-update-helper.mjs',
            'build-workstation-service.mjs'
          )) {
            node (Join-Path 'tools/scripts' $script)
            if ($LASTEXITCODE -ne 0) { throw "Native candidate build failed: $script" }
          }
          npm run db:generate
          if ($LASTEXITCODE -ne 0) { throw 'Prisma generation failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Server/Web compilation failed' }
          npm run cluster:installer:build
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned test installer packaging failed' }
          if (!(Test-Path bin/Cluster-Installer.exe)) { throw 'No candidate installer' }
      - name: Fetch published 1.0.5 installer from THIS repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prior = Join-Path $env:RUNNER_TEMP 'cluster-prior-1.0.5'
          New-Item -ItemType Directory -Force -Path $prior | Out-Null
          gh release download v1.0.5 --repo ${{ github.repository }} --pattern 'Cluster-Installer.exe' --dir $prior
          if ($LASTEXITCODE -ne 0) { throw 'Published v1.0.5 Server installer could not be retrieved' }
          if (!(Test-Path (Join-Path $prior 'Cluster-Installer.exe'))) { throw 'Published Server installer missing' }
      - name: Execute disposable offline in-place upgrade and preservation test
        shell: pwsh
        run: |
          $prior = Join-Path $env:RUNNER_TEMP 'cluster-prior-1.0.5\Cluster-Installer.exe'
          $candidate = Join-Path (Get-Location).Path 'bin\Cluster-Installer.exe'
          $candidateIdentity = Get-Content -LiteralPath 'config/release-candidate.json' -Raw | ConvertFrom-Json
          if ($candidateIdentity.channel -ne 'stable' -or [int]$candidateIdentity.sequence -le 55) {
            throw 'Offline upgrade candidate must be newer than the published 1.0.5 Server installer'
          }
          & pwsh -NoProfile -NonInteractive -File tools/installer/Smoke-Cluster-Windows-Upgrade.ps1 -PriorInstaller $prior -CandidateInstaller $candidate -PriorSequence 55 -CandidateSequence ([int]$candidateIdentity.sequence)
          if ($LASTEXITCODE -ne 0) { throw 'Offline 1.0.5 -> candidate upgrade or preservation failed' }

# This is a disposable OFFLINE, no-PostgreSQL-running smoke. It is not
# authorization to expose automatic install, bypass the publisher signature,
# merge a release, or certify live Windows Service recovery.

  published-1-1-2-upgrade:
    name: Verify published 1.1.1 to 1.1.2 Windows offline preservation
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout audited upgrade smoke harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download and hash-pin both immutable published Server installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = @(
            @{ Tag='v1.1.1'; Bytes=240159232; Sha256='0604f59d73c9cf64858196d17b8e0da4980ec9ec6cf9b9b1a07683682e84db97' },
            @{ Tag='v1.1.2'; Bytes=240163328; Sha256='f1a9a8f0accdd016ed29822d9313d680553980f4826d3dbff92595f7b8978673' }
          )
          foreach ($release in $releases) {
            $target = Join-Path $env:RUNNER_TEMP "cluster-published-$($release.Tag)"
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            gh release download $release.Tag --repo $env:GITHUB_REPOSITORY --pattern 'Cluster-Installer.exe' --dir $target
            if ($LASTEXITCODE -ne 0) { throw "Cannot download immutable Server release $($release.Tag)" }
            $installer = Join-Path $target 'Cluster-Installer.exe'
            $file = Get-Item -LiteralPath $installer -ErrorAction Stop
            if ($file.Length -ne $release.Bytes) { throw "Unexpected installer size: $($release.Tag)" }
            $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -cne $release.Sha256) { throw "Pinned installer digest mismatch: $($release.Tag)" }
            $stream = [IO.File]::OpenRead($installer)
            try {
              if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Not a Windows PE installer: $($release.Tag)" }
            } finally { $stream.Dispose() }
            Write-Host "Verified immutable published $($release.Tag) installer size and SHA-256."
          }
      - name: Upgrade the same disposable Windows installation without losing stored files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prior = Join-Path $env:RUNNER_TEMP 'cluster-published-v1.1.1/Cluster-Installer.exe'
          $candidate = Join-Path $env:RUNNER_TEMP 'cluster-published-v1.1.2/Cluster-Installer.exe'
          & pwsh -NoProfile -NonInteractive -File tools/installer/Smoke-Cluster-Windows-Upgrade.ps1 -PriorInstaller $prior -CandidateInstaller $candidate -PriorSequence 100001 -CandidateSequence 100002
          if ($LASTEXITCODE -ne 0) { throw 'Published 1.1.1 -> 1.1.2 offline Windows upgrade failed' }

# This published-artifact upgrade test covers installation, byte-for-byte
# preservation of inactive PostgreSQL/Library/config fixtures, and rollback
# snapshot retention. It does NOT certify a running PostgreSQL database,
# service shutdown/recovery, live user sessions, or populated-server rollback.
