name: Add stable latest-download names to Cluster releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-stable-release-names-once.yml

permissions:
  contents: write

jobs:
  aliases:
    name: Verify and add stable Desktop download names to v1.0.1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate current release and add byte-identical aliases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "NotAzureStudios/Cluster" ]] || exit 1
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          repo="$GITHUB_REPOSITORY"
          latest="$(gh release view --repo "$repo" --json tagName --jq .tagName)"
          [[ "$latest" == 'v1.0.1' ]] || { echo "Expected v1.0.1 latest, got $latest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/aliases"
          cd "$RUNNER_TEMP/aliases"
          gh release download "$latest" --repo "$repo" \
            --pattern 'Cluster-Desktop-Installer-0.482.0-windows-x64.exe' \
            --pattern 'Cluster-Desktop-0.482.0-windows-x64.zip'
          echo '0e983320e440ff0b25cd56b8e14b6fcc76d565188e59245ca90923ec58537a05  Cluster-Desktop-Installer-0.482.0-windows-x64.exe' | sha256sum -c -
          echo '30b0d3cd64ea2c787a4eb87bfb5ba5bb50b19dd566e89a70746dee8f15242862  Cluster-Desktop-0.482.0-windows-x64.zip' | sha256sum -c -
          cp 'Cluster-Desktop-Installer-0.482.0-windows-x64.exe' 'Cluster-Desktop-Installer.exe'
          cp 'Cluster-Desktop-0.482.0-windows-x64.zip' 'Cluster-Desktop-Portable.zip'
          for name in Cluster-Desktop-Installer.exe Cluster-Desktop-Portable.zip; do
            existing="$(gh release view "$latest" --repo "$repo" --json assets --jq '.assets[].name' | grep -Fx "$name" || true)"
            if [[ -z "$existing" ]]; then
              gh release upload "$latest" "$name" --repo "$repo"
            else
              echo "Already exists: $name. Refusing to overwrite it."
            fi
          done
          test "$(gh release view "$latest" --repo "$repo" --json assets --jq '.assets[].name' | grep -Ec '^(Cluster-Installer.exe|Cluster-Desktop-Installer.exe|Cluster-Desktop-Portable.zip)$')" -eq 3
          echo 'Latest release now carries stable download asset names.'
# One-time byte-identical release aliases. Keep stable filename contract in
# docs/releases/README.md for future publishers; never overwrite old assets.
