name: v1.1 Role Identity Safety

on:
  push:
    branches: [development, fix/v1.1-role-identity-safety]
    paths:
      - 'apps/server/src/app/server-routes-configuration-integrations.ts'
      - 'packages/renderer/src/features/settings/StudioSettingsPage.tsx'
      - 'tools/scripts/cluster-v11-role-governance-tests.mjs'
      - '.github/workflows/v11-role-governance.yml'
  pull_request:
    branches: [development]
    paths:
      - 'apps/server/src/app/server-routes-configuration-integrations.ts'
      - 'packages/renderer/src/features/settings/StudioSettingsPage.tsx'
      - 'tools/scripts/cluster-v11-role-governance-tests.mjs'
      - '.github/workflows/v11-role-governance.yml'

permissions:
  contents: read

jobs:
  role-governance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: node tools/scripts/cluster-v11-role-governance-tests.mjs
