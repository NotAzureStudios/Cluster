name: One-shot reconcile generated icon catalog for Server RC

on:
  push:
    branches: [server/windows]

permissions:
  contents: write

concurrency:
  group: reconcile-locked-icons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current server candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Node 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Reproduce pinned icon compiler inputs
        run: |
          node tools/scripts/cluster-release-lockfile-check.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          node tools/scripts/generate-cluster-icons.mjs
      - name: Commit generated catalog only when it is the sole tracked change
        shell: bash
        run: |
          set -euo pipefail
          expected="packages/renderer/src/components/icon-catalog.generated.json"
          changes="$(git diff --name-only)"
          if [[ -z "$changes" ]]; then
            echo 'Generated catalog already matches tracked source.'
            exit 0
          fi
          if [[ "$changes" != "$expected" ]]; then
            echo "Unexpected tracked changes during locked codegen:"
            printf '%s\n' "$changes"
            exit 1
          fi
          git add -- "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build: reconcile pinned generated icon catalog for release"
          git push origin HEAD:server/windows
