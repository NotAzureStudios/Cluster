name: Reproducible Node and workspace release build

on:
  push:
    branches: [development, main, 'fix/1-0-reproducible-build']
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: cluster-locked-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locked-node-build:
    name: Locked npm ci and Server/Web compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Strict lockfile admission
        run: node tools/scripts/cluster-release-lockfile-check.mjs
      - name: Reproduce dependencies from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Prisma client generation from pinned workspace
        run: npm run db:generate
        env:
          DIRECT_DATABASE_URL: postgresql://cluster_build:unused@127.0.0.1:1/cluster_build
          DATABASE_URL: postgresql://cluster_build:unused@127.0.0.1:1/cluster_build
      - name: Compile actual Server and Web applications
        run: npm run build
        env:
          DIRECT_DATABASE_URL: postgresql://cluster_build:unused@127.0.0.1:1/cluster_build
          DATABASE_URL: postgresql://cluster_build:unused@127.0.0.1:1/cluster_build
      - name: Database analytics query budget regression
        run: node tools/scripts/cluster-performance-analytics-query-tests.mjs
      - name: Request I/O coalescing and update hold safety
        run: node tools/scripts/cluster-request-io-coalescing-tests.mjs
      - name: Queue counts and pressure single-flight regression
        run: node tools/scripts/cluster-queue-read-singleflight-tests.mjs
      - name: Live read baseline utility safety regression
        run: node tools/scripts/cluster-live-read-baseline-tests.mjs
      - name: Visible refresh and background poll backoff regression
        run: node tools/scripts/cluster-visible-refresh-backoff-tests.mjs
      - name: Search CPU worker and stale-index regression
        run: |
          node tools/scripts/cluster-search-postings-worker-tests.mjs
          node tools/scripts/cluster-0506-search-policy-assertions.mjs
      - name: Completed upload range and conditional-stream certification
        run: node tools/scripts/cluster-completed-upload-range-tests.mjs
      - name: Buffered upload admission and transfer memory budget regression
        run: node tools/scripts/cluster-upload-chunk-admission-tests.mjs
      - name: Browser upload backpressure and durable recovery regression
        run: node tools/scripts/cluster-upload-client-backpressure-tests.mjs
      - name: Bounded storage preview prefix regression
        run: node tools/scripts/cluster-upload-prefix-memory-tests.mjs
      - name: Assert compiled outputs exist
        shell: pwsh
        run: |
          $required = @(
            'packages/shared/dist/index.js',
            'apps/server/dist/index.js',
            'apps/server/dist/generated/prisma/client.js',
            'apps/web/dist/index.html'
          )
          foreach ($item in $required) {
            if (!(Test-Path -LiteralPath $item -PathType Leaf)) { throw "Build output missing: $item" }
          }
          if (@(Get-ChildItem 'apps/web/dist/assets' -Filter '*.js').Count -lt 1) { throw 'Missing compiled Web JavaScript bundle' }
      - name: Report source and dependency identity
        shell: pwsh
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          (Get-FileHash -Algorithm SHA256 package-lock.json).Hash
