name: v1.1 Department Identity Contracts

on:
  push:
    branches: [development, feat/v1.1-department-identity]
    paths:
      - 'apps/server/prisma/**'
      - 'apps/server/src/domains/workforce/**'
      - 'apps/server/src/domains/departments/**'
      - 'packages/renderer/src/components/DepartmentIdentityMark.tsx'
      - 'packages/renderer/src/features/people/CompanyGraphPanel.tsx'
      - 'tools/scripts/cluster-v11-department-identity-tests.mjs'
      - '.github/workflows/v11-department-identity.yml'
  pull_request:
    branches: [development]
    paths:
      - 'apps/server/prisma/**'
      - 'apps/server/src/domains/workforce/**'
      - 'apps/server/src/domains/departments/**'
      - 'packages/renderer/src/components/DepartmentIdentityMark.tsx'
      - 'packages/renderer/src/features/people/CompanyGraphPanel.tsx'
      - 'tools/scripts/cluster-v11-department-identity-tests.mjs'
      - '.github/workflows/v11-department-identity.yml'

permissions:
  contents: read

jobs:
  identity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: node tools/scripts/cluster-v11-department-identity-tests.mjs
