name: v1.1 Department Lead Management

on:
  push:
    branches: [development, feat/v11-department-lead-management]
    paths:
      - 'apps/server/src/domains/departments/department-routes.ts'
      - 'packages/renderer/src/features/settings/WorkforceDepartmentManager.tsx'
      - 'tools/scripts/cluster-v11-department-leads-tests.mjs'
      - '.github/workflows/v11-department-leads.yml'
  pull_request:
    branches: [development]
    paths:
      - 'apps/server/src/domains/departments/department-routes.ts'
      - 'packages/renderer/src/features/settings/WorkforceDepartmentManager.tsx'
      - 'tools/scripts/cluster-v11-department-leads-tests.mjs'
      - '.github/workflows/v11-department-leads.yml'

permissions:
  contents: read

jobs:
  lead-management:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: node tools/scripts/cluster-v11-department-leads-tests.mjs
      - run: node tools/scripts/cluster-v11-canonical-department-manager-tests.mjs
