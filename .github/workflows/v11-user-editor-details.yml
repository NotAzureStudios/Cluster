name: v1.1 User Editor Details

on:
  pull_request:
    branches: [development]
    paths:
      - 'packages/renderer/src/features/people/PeopleUserEditor.tsx'
      - 'packages/renderer/src/features/people/people-user-editor-draft.ts'
      - 'tools/scripts/cluster-v11-user-editor-details-tests.mjs'
      - '.github/workflows/v11-user-editor-details.yml'
  push:
    branches: [development, feat/v1.1-user-editor-details]
    paths:
      - 'packages/renderer/src/features/people/PeopleUserEditor.tsx'
      - 'packages/renderer/src/features/people/people-user-editor-draft.ts'
      - 'tools/scripts/cluster-v11-user-editor-details-tests.mjs'
      - '.github/workflows/v11-user-editor-details.yml'

permissions:
  contents: read

jobs:
  user-editor-detail-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types tools/scripts/cluster-v11-user-editor-details-tests.mjs
