name: v1.1 Create Account Role Catalog

on:
  pull_request:
    branches: [development]
    paths:
      - 'packages/renderer/src/features/people/PeoplePages.tsx'
      - 'packages/renderer/src/features/people/people-role-choice.ts'
      - 'tools/scripts/cluster-v11-create-role-catalog-tests.mjs'
      - '.github/workflows/v11-create-role-catalog.yml'
  push:
    branches: [development, feat/v11-create-role-picker]
    paths:
      - 'packages/renderer/src/features/people/PeoplePages.tsx'
      - 'packages/renderer/src/features/people/people-role-choice.ts'
      - 'tools/scripts/cluster-v11-create-role-catalog-tests.mjs'
      - '.github/workflows/v11-create-role-catalog.yml'

permissions:
  contents: read

jobs:
  create-role-catalog-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types tools/scripts/cluster-v11-create-role-catalog-tests.mjs
