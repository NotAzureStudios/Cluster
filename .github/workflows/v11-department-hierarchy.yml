name: Cluster 1.1 Department Hierarchy UI
on:
  pull_request:
    branches: [development]
    paths:
      - "packages/renderer/src/features/settings/department-hierarchy.ts"
      - "packages/renderer/src/features/settings/WorkforceDepartmentManager.tsx"
      - "packages/renderer/src/features/settings/workforce-department-manager.css"
      - "tools/scripts/cluster-v11-department-hierarchy-tests.mjs"
      - ".github/workflows/v11-department-hierarchy.yml"
  push:
    branches: [feat/v11-department-hierarchy-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  department-hierarchy:
    name: Department hierarchy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
      - run: npm ci --no-audit --no-fund
      - name: Department tree projections and interaction contracts
        run: node tools/scripts/cluster-v11-department-hierarchy-tests.mjs
      - name: Build shared packages
        run: npm run build --workspace=@cluster/shared
      - name: Compile and type-check renderer
        run: npm run build --workspace=@cluster/renderer
