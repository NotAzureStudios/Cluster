name: Cluster 1.1 Effective Access Inspector
on:
  pull_request:
    branches: [development]
    paths:
      - "packages/renderer/src/components/ClusterEffectiveAccessInspector.tsx"
      - "packages/renderer/src/components/cluster-effective-access-inspector.css"
      - "packages/renderer/src/features/settings/StudioSettingsPage.tsx"
      - "tools/scripts/cluster-v11-effective-access-inspector-tests.mjs"
      - ".github/workflows/v11-effective-access-inspector.yml"
  push:
    branches: [feat/v11-role-effective-access-inspector]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-access:
    name: Role policy inspector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
      - run: npm ci --no-audit --no-fund
      - name: Validate provenance and snapshot isolation
        run: node tools/scripts/cluster-v11-effective-access-inspector-tests.mjs
      - name: Build shared contracts
        run: npm run build --workspace=@cluster/shared
      - name: Compile and type-check renderer
        run: npm run build --workspace=@cluster/renderer
