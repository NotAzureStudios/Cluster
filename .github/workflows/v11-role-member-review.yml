name: Cluster 1.1 Role Member Review
on:
  pull_request:
    branches: [development]
    paths:
      - "packages/renderer/src/features/settings/RoleMembershipReviewPanel.tsx"
      - "packages/renderer/src/features/settings/role-membership-review.css"
      - "packages/renderer/src/features/settings/StudioSettingsPage.tsx"
      - "tools/scripts/cluster-v11-role-member-review-tests.mjs"
      - ".github/workflows/v11-role-member-review.yml"
  push:
    branches: [feat/v11-role-member-review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  member-review:
    name: Role member review (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
      - run: npm ci --no-audit --no-fund
      - name: Run role membership review regressions
        run: node tools/scripts/cluster-v11-role-member-review-tests.mjs
      - name: Build shared contracts
        run: npm run build --workspace=@cluster/shared
      - name: Compile and type-check renderer
        run: npm run build --workspace=@cluster/renderer
