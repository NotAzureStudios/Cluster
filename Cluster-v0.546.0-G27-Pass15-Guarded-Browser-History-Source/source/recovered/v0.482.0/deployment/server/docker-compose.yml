services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: cluster
      POSTGRES_USER: cluster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - cluster-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cluster -d cluster"]
      interval: 10s
      timeout: 5s
      retries: 10
  cluster:
    build:
      context: ../..
      dockerfile: deployment/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cluster:${POSTGRES_PASSWORD}@postgres:5432/cluster
      DIRECT_DATABASE_URL: postgresql://cluster:${POSTGRES_PASSWORD}@postgres:5432/cluster
      CLUSTER_HOST: 0.0.0.0
      CLUSTER_PORT: 4000
    ports:
      - "${CLUSTER_PORT:-4000}:4000"
    volumes:
      - cluster-data:/var/lib/cluster
volumes:
  cluster-postgres:
  cluster-data:
